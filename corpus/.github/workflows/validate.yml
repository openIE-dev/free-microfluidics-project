name: Validate corpus

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate corpus (strict mode)
        run: python3 tools/validate.py corpus.jsonl --strict

      - name: Regenerate cross-cuts and indices (idempotency check)
        run: |
          python3 tools/cross_cuts.py
          python3 tools/index.py .

      - name: Fail if generated artifacts are stale
        run: |
          if ! git diff --quiet -- CORPUS_INDEX.md lineage.json academic.jsonl private.jsonl open.jsonl fictional.jsonl cross_cuts/; then
            echo "Generated artifacts are out of date. Run:"
            echo "  python3 tools/index.py ."
            echo "  python3 tools/cross_cuts.py"
            echo "and commit the result."
            git diff --stat
            exit 1
          fi
